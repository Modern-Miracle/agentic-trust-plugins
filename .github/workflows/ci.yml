name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-validate:
    name: JSON schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: pip install check-jsonschema==0.31.3

      - name: Validate marketplace.json against claude-code-marketplace schema
        run: |
          check-jsonschema \
            --schemafile https://www.schemastore.org/claude-code-marketplace.json \
            .claude-plugin/marketplace.json

      - name: Discover plugin.json files (glob, not manifest listing) and validate against schema
        # Discovered by glob under plugins/*/.claude-plugin/, not by reading
        # marketplace.json's plugin list — a plugin directory the manifest
        # doesn't mention must still be schema-validated (audit finding G10).
        # An empty glob is a broken check, not a pass.
        run: |
          files=$(find plugins -mindepth 3 -maxdepth 3 -path '*/.claude-plugin/plugin.json' | sort)
          if [ -z "$files" ]; then
            echo "no plugin.json found under plugins/*/.claude-plugin/ — glob is broken or plugins/ is empty"
            exit 1
          fi
          echo "validating:"
          echo "$files"
          check-jsonschema \
            --schemafile https://www.schemastore.org/claude-code-plugin-manifest.json \
            $files

      - name: marketplace.json <-> plugins/ directory consistency (both directions)
        run: |
          python3 - <<'PY'
          import glob, json, os, sys

          errs = []
          m = json.load(open(".claude-plugin/marketplace.json"))
          entries = m.get("plugins", [])

          manifest_dirs = set()
          for p in entries:
              name = p.get("name")
              src = (p.get("source") or "").lstrip("./")
              manifest_dirs.add(src)
              pj_path = os.path.join(src, ".claude-plugin", "plugin.json")
              if not os.path.exists(pj_path):
                  errs.append(f"{name}: marketplace.json points at {src!r} but {pj_path} is missing")
                  continue
              pj = json.load(open(pj_path))
              if p.get("name") != pj.get("name"):
                  errs.append(f"{name}: plugin.json name is {pj.get('name')!r}")
              if p.get("version") != pj.get("version"):
                  errs.append(
                      f"{name}: version differs between marketplace.json "
                      f"({p.get('version')!r}) and plugin.json ({pj.get('version')!r})"
                  )

          # Reverse direction: every plugin directory actually present on
          # disk must be declared in the marketplace manifest. A PR adding
          # plugins/foo/ with its own manifest but no marketplace entry must
          # fail CI, not slip through untested (audit finding G10).
          on_disk_dirs = {
              os.path.dirname(os.path.dirname(p))
              for p in glob.glob("plugins/*/.claude-plugin/plugin.json")
          }
          undeclared = on_disk_dirs - manifest_dirs
          if undeclared:
              errs.append(
                  "plugin dir(s) present on disk but missing from marketplace.json: "
                  f"{sorted(undeclared)}"
              )

          if errs:
              print("\n".join(errs)); sys.exit(1)
          print("marketplace consistent:", [f'{p["name"]}@{p["version"]}' for p in entries])
          PY

  mcp-config-validate:
    name: .mcp.json shape validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate every .mcp.json under plugins/ has the correct remote-http shape
        run: |
          python3 - <<'PY'
          import glob, json, sys

          # Every hosted gateway endpoint any plugin in this marketplace is
          # allowed to wire. A PR that swaps the host (MCP-URL substitution)
          # MUST fail here — a scheme-only check is not enough (audit finding
          # F1), and this allowlist is enforced against EVERY plugin's
          # .mcp.json, not just one hardcoded path (audit finding G10).
          ALLOWED_MCP_URLS = {
              "https://agents.modernmiracle.org/mcp",
          }

          # Discovered by glob under plugins/, not by reading the marketplace
          # manifest's plugin list — a plugin directory the manifest doesn't
          # mention must still be validated (and therefore still fail if it
          # ships an unsafe .mcp.json). No unvalidated escape hatch.
          paths = sorted(glob.glob("plugins/*/.mcp.json"))
          if not paths:
              print("no .mcp.json found under plugins/*/ — glob is broken or plugins/ is empty")
              sys.exit(1)

          errs = []
          for path in paths:
              with open(path) as f:
                  cfg = json.load(f)

              servers = cfg.get("mcpServers")
              if not isinstance(servers, dict) or not servers:
                  errs.append(f"{path}: mcpServers must be a non-empty object")
                  continue

              for name, entry in servers.items():
                  who = f"{path}:{name}"
                  # Remote HTTP servers must declare type + url explicitly.
                  # ("streamable-http" is accepted by Claude Code as an alias for "http".)
                  if entry.get("type") not in ("http", "streamable-http"):
                      errs.append(
                          f"{who}: expected type 'http' (or alias 'streamable-http'), "
                          f"got {entry.get('type')!r}"
                      )
                  # EXACT membership in the allowlist, not just an https://
                  # scheme check. Any other URL is a supply-chain substitution.
                  if entry.get("url") not in ALLOWED_MCP_URLS:
                      errs.append(
                          f"{who}: url must be one of {sorted(ALLOWED_MCP_URLS)}, "
                          f"got {entry.get('url')!r}"
                      )
                  # Open/anonymous tier: no static auth header should ever be committed here.
                  if "headers" in entry:
                      errs.append(f"{who}: no auth headers expected on the open verifier tier")
                  if "headersHelper" in entry:
                      errs.append(f"{who}: no auth headers expected on the open verifier tier")

          if errs:
              print("\n".join(errs))
              sys.exit(1)

          print(f"mcp config OK ({len(paths)} file(s)):")
          for path in paths:
              print(" -", path)
          PY

  gateway-reachability:
    name: gateway reachability smoke test
    runs-on: ubuntu-latest
    # Informational: a transient outage of the hosted gateway must not block
    # merging repo changes. The job still runs and reports on every PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Health endpoint responds 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://agents.modernmiracle.org/health)
          echo "GET /health -> $code"
          test "$code" = "200"

      - name: Anonymous MCP initialize responds 200 (no token)
        # The anonymous tier is LIVE: an unauthenticated `initialize` POST
        # with the streamable-HTTP Accept pair negotiates and returns 200.
        # Assert exactly that — a 401, 5xx, or 000 is a regression of the
        # open verifier tier (audit finding F5).
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -X POST https://agents.modernmiracle.org/mcp \
            -H "content-type: application/json" \
            -H "accept: application/json, text/event-stream" \
            -H "user-agent: node" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0.0.1"}}}')
          echo "POST /mcp (anonymous initialize) -> $code"
          test "$code" = "200"

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release
      # checksums file (gitleaks_8.30.1_checksums.txt).
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action v2+ requires a paid org license
      # (https://github.com/gitleaks/gitleaks-action#-announcement). Run the
      # OSS gitleaks CLI directly instead, pinned by version AND verified
      # against its official sha256 before execution (audit finding F3).
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v

  markdown-link-check:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # 1.0.17
        with:
          use-quiet-mode: "yes"
          config-file: ".github/mlc-config.json"

  catalogue-integrity:
    name: catalogue integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate catalogue.json structure
        # The catalogue is the public vocabulary every issued credential is
        # interpreted against. Its shape is load-bearing: every tool must
        # carry all five capability flags (four since v1.0.0 plus v1.1.0's
        # significant_effect - the GDPR Art-22 derivation input) and a data
        # class registered in the catalogue's own data_classes list, or a
        # credential attesting it is uninterpretable.
        run: |
          python3 - <<'PY'
          import json, sys

          errs = []
          with open("catalogue/v1/catalogue.json") as f:
              cat = json.load(f)

          REQUIRED_TOP = [
              "catalogue_version", "published", "issuer",
              "registry", "archetypes", "data_classes", "tools",
          ]
          for key in REQUIRED_TOP:
              if key not in cat:
                  errs.append(f"missing required top-level key: {key!r}")

          REQUIRED_FLAGS = [
              "produces_synthetic_image",
              "produces_synthetic_audio_video_text",
              "publishes_public_interest_text",
              "emotion_recognition_or_biometric_categorisation",
              "significant_effect",
          ]
          data_classes = set(cat.get("data_classes", []))
          tools = cat.get("tools", [])
          if not tools:
              errs.append("tools must be a non-empty list")

          for tool in tools:
              tid = tool.get("id", "<missing id>")
              for key in ("id", "description", "data_class", "risk", "capabilities"):
                  if key not in tool:
                      errs.append(f"tool {tid}: missing key {key!r}")
              if tool.get("data_class") not in data_classes:
                  errs.append(
                      f"tool {tid}: data_class {tool.get('data_class')!r} "
                      f"is not in the registered data_classes {sorted(data_classes)}"
                  )
              caps = tool.get("capabilities", {})
              for flag in REQUIRED_FLAGS:
                  if not isinstance(caps.get(flag), bool):
                      errs.append(
                          f"tool {tid}: capability flag {flag!r} must be present "
                          f"and boolean, got {caps.get(flag)!r}"
                      )
              extra = set(caps) - set(REQUIRED_FLAGS)
              if extra:
                  errs.append(f"tool {tid}: unknown capability flag(s) {sorted(extra)}")

          if errs:
              print("\n".join(errs)); sys.exit(1)
          print(
              f"catalogue OK: version {cat['catalogue_version']}, "
              f"{len(cat['archetypes'])} archetypes, "
              f"{len(data_classes)} data classes, {len(tools)} tools"
          )
          PY

      - name: Recorded sha256 in catalogue/README.md matches catalogue.json
        # The hash recorded in the ANCHORING section is what gets anchored
        # on-chain. If the file and the recorded hash ever disagree, either
        # the catalogue was edited without cutting a new version (immutability
        # violation) or the README lies about what was anchored. Both must
        # fail CI.
        run: |
          recorded=$(grep -oE 'sha256\(catalogue/v1/catalogue\.json\) = [0-9a-f]{64}' catalogue/README.md | grep -oE '[0-9a-f]{64}')
          if [ -z "$recorded" ]; then
            echo "no sha256 for catalogue/v1/catalogue.json recorded in catalogue/README.md"
            exit 1
          fi
          actual=$(shasum -a 256 catalogue/v1/catalogue.json | cut -d' ' -f1)
          echo "recorded: $recorded"
          echo "actual:   $actual"
          test "$recorded" = "$actual"
